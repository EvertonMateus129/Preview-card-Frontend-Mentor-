<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      :root {
        --yellow-bg-color: hsl(47, 88%, 63%);
        --card-bg-color: hsl(0, 0%, 100%);
        --text-color: hsl(0, 0%, 42%);
        --strong-color: hsl(0, 0%, 7%);

      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: "Figtree";
        height: 100vh;
      }
      
    </style>
  </head>
  <body>
    <main class="card-preview-container">
      <div class="card-preview-image">
        <img
          src="./assets/images/illustration-article.svg"
          alt="card-preview-image"
        />
      </div>
      <div class="card-preview-content">
        <strong>Learning</strong>

        <span>Publish 21 Dec 2023</span>

        <h1>HTML & CSS foundations</h1>

        <p>
          These languages are the backbone of every website, defining structure,
          content, and presentation
        </p>
      </div>

      <div class="card-preview-author">
        <img
          src="./assets/images/image-avatar.webp"
          alt="image-avatar-Greg-Hooper"
        />
        <span>Greg Hooper</span>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/EvertonMateus129">Everton Mateus</a>.
    </footer>
  </body>
</html>
