<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Blog preview card</title>

  
    <style>
      :root {
        --yellow-bg-color: hsl(47, 88%, 63%);
        --card-bg-color: hsl(0, 0%, 100%);
        --text-color: hsl(0, 0%, 42%);
        --strong-color: hsl(0, 0%, 7%);

      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      
      html {
        font-size: 62.5%;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: "Figtree";
        height: 100vh;
        background-color: var(--yellow-bg-color);
      }

      .card-preview-container {
        background-color: var(--card-bg-color);
        padding: 2.4rem;
        width: 38.4rem;
        border-radius: 12px;
        box-shadow: 6px 6px;
        border: 1px solid black;
      }

      .card-preview-image {
        margin-bottom: 2.4rem;
      }

      .card-preview-image img {
        width: 33.6rem;
        border-radius: 8px;
      }

      .card-preview-content {
        display: flex;
        align-content: center;
        flex-direction: column;
        
      }

      .card-preview-content strong {
        display: inline;
        color: var(--strong-color);
        background-color: var(--yellow-bg-color);
        padding: .4rem 1.2rem;
        border-radius: .5rem;
        font-size: 1.4rem;
        align-self: flex-start;
        margin-bottom: 1.2rem;
      }
      
      .card-preview-content span {
        font-size: 1.4rem;
        font-weight: 500;
        margin-bottom: 1.2rem;
      }

      .card-preview-content h1 {
        font-size: 2.4rem;
        margin-bottom: 1.2rem;
      }

      .card-preview-content h1:hover {
        cursor: pointer;
        color: var(--yellow-bg-color);
      }
      .card-preview-content p {
        font-size: 1.6rem;
        margin-bottom: 2.4rem;
        font-weight: 500;
        color: var(--text-color);
      }

      .card-preview-author {
        display: flex;
        align-items: center;

      }

      .card-preview-author img {
        width: 3.2rem;
        margin-right: 1.2rem;
      }

      .card-preview-author span {
        font-size: 1.4rem;
        font-weight: 800;
      }

      .attribution {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 1.2rem;
        color: var(--text-color);
      }

      @media (min-width: 375px){
        .card-preview-container {
          width: 32.7rem;
        }

        .card-preview-image img {
          width: 27.9rem;
        }

        .card-preview-content strong {
          font-size: 1.2rem;
        }

        .card-preview-content span {
          font-size: 1.2rem;
        }

        .card-preview-content h1 {
          font-size: 2rem;
        }

        .card-preview-content p {
          font-size: 1.4rem;
        }
        
        
        
      }
      


    </style>
  </head>
  <body>
    <main class="card-preview-container">
      <div class="card-preview-image">
        <img
          src="./assets/images/illustration-article.svg"
          alt="card-preview-image"
        />
      </div>
      <div class="card-preview-content">
        <strong>Learning</strong>

        <span>Publish 21 Dec 2023</span>

        <h1>HTML & CSS foundations</h1>

        <p>
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>

      <div class="card-preview-author">
        <img
          src="./assets/images/image-avatar.webp"
          alt="image-avatar-Greg-Hooper"
        />
        <span>Greg Hooper</span>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/EvertonMateus129">Everton Mateus</a>.
    </footer>
  </body>
</html>
